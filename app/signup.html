<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LessonPrep — Create account</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14532d">
<style>
.auth{max-width:520px;margin:4vh auto;padding:24px}.auth h1{color:var(--primary);margin:0 0 4px}
.auth label{display:block;margin:10px 0}.auth input,.auth select,.auth textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:16px;margin-top:4px;font-family:inherit}
.req{color:#b91c1c;font-weight:800}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{background:#fee2e2;color:#991b1b;border-radius:8px;padding:10px;margin-top:12px;display:none}
</style>
</head>
<body>
<main class="wrap"><div class="card auth">
<h1>Create your account</h1>
<p class="hint">Fields marked <span class="req">*</span> are compulsory. Already have one? <a href="login.html"><b>Sign in</b></a></p>
<div class="row2">
<label>First name <span class="req">*</span><input id="s-first" placeholder="Adaeze"></label>
<label>Middle name<input id="s-middle" placeholder="(optional)"></label>
</div>
<label>Last name <span class="req">*</span><input id="s-last" placeholder="Okafor"></label>
<div class="row2">
<label>Age<input id="s-age" type="number" min="5" max="120" placeholder="(optional)"></label>
<label>Gender <span class="req">*</span><select id="s-gender"><option value="">Select…</option><option>Female</option><option>Male</option><option>Other</option><option>Prefer not to say</option></select></label>
</div>
<label>Phone number <span class="req">*</span><input id="s-phone" inputmode="tel" placeholder="e.g. 0803 123 4567"></label>
<label>Email address<input id="s-email" type="email" placeholder="(optional — needed only if you want to sign in with email)"></label>
<label>Country of residence <span class="req">*</span><input id="s-country" placeholder="e.g. Nigeria"></label>
<label>Address <span class="req">*</span><textarea id="s-address" placeholder="Street / town"></textarea></label>
<div class="row2">
<label>Create password <span class="req">*</span><input id="s-pw1" type="password" autocomplete="new-password" placeholder="Min. 6 characters"></label>
<label>Confirm password <span class="req">*</span><input id="s-pw2" type="password" autocomplete="new-password" placeholder="Repeat it"></label>
</div>
<p><button class="btn-p" id="go" style="width:100%">Sign up</button></p>
<div class="err" id="err"></div>
</div></main>
<script src="auth.js"></script>
<script>
(function(){
  if (Auth.current()) { location.replace("index.html"); return; }
  function fail(m){ var e = document.getElementById("err"); e.style.display = ""; e.textContent = m; window.scrollTo(0, document.body.scrollHeight); }
  document.getElementById("go").addEventListener("click", async function(){
    var v = function(id){ return document.getElementById(id).value; };
    var data = { firstName: v("s-first"), middleName: v("s-middle"), lastName: v("s-last"), age: v("s-age").trim(),
      phone: v("s-phone"), email: v("s-email"), country: v("s-country"), address: v("s-address"), gender: v("s-gender") };
    var pw1 = v("s-pw1"), pw2 = v("s-pw2");
    if (!data.firstName.trim()) return fail("First name is compulsory.");
    if (!data.lastName.trim()) return fail("Last name is compulsory.");
    if (!data.phone.trim() || data.phone.replace(/\D/g,"").length < 7) return fail("A valid phone number is compulsory.");
    if (!data.country.trim()) return fail("Country of residence is compulsory.");
    if (!data.address.trim()) return fail("Address is compulsory.");
    if (!data.gender) return fail("Please select your gender.");
    if (data.email.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email.trim())) return fail("That email address does not look valid.");
    if (data.age && (Number(data.age) < 5 || Number(data.age) > 120)) return fail("Please enter a valid age (or leave it empty).");
    if (pw1.length < 6) return fail("Password must be at least 6 characters.");
    if (pw1 !== pw2) return fail("Passwords do not match.");
    data.password = pw1;
    var btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "Creating account…";
    try { await Auth.signup(data); location.href = "index.html"; }
    catch (e) { fail(e.message); btn.disabled = false; btn.textContent = "Sign up"; }
  });
})();
</script>
</body>
</html>
