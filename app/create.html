<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LessonPrep — Create</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">LessonPrep</header>
<nav class="tabs" aria-label="Main">
<a href="index.html">Home</a><a class="on" href="create.html">Create</a><a href="lessons.html">Lessons</a><a href="resources.html">Resources</a><a href="profile.html">Profile</a>
</nav>
<main class="wrap">
<div class="card"><b>What are you teaching?</b><br><input id="topic" value="JSS2 Mathematics — Algebra" style="width:100%;min-height:48px;border:1px solid var(--line);border-radius:8px;padding:0 12px;margin-top:8px"></div>
<div class="card"><b>Start from</b><div class="chips"><span>Topic</span><span>Scheme</span><span>Textbook</span><span>Previous lesson</span><span>Blank</span></div></div>
<div class="card"><b>How much help?</b><div class="chips"><span class="sel">Quick Prep</span><span>Standard</span><span>Deep Prep</span></div><p class="hint">Static preview — modes + AI arrive in later stages. Quick = essentials only.</p></div>
<p><button class="btn-p" id="draftBtn">Draft lesson →</button></p>
</main>
<script src="app.js"></script>
<script>
document.getElementById("draftBtn").addEventListener("click", function(){
  var t = document.getElementById("topic").value || "Untitled lesson";
  var l = LP.newLesson(t);
  location.href = "lesson.html?id=" + l.id;
});
</script>
</body>
</html>
