<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LessonPrep — Create</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14532d">
</head>
<body>
<header class="appbar">LessonPrep</header>
<nav class="tabs" aria-label="Main">
<a href="index.html">Home</a><a class="on" href="create.html">Create</a><a href="lessons.html">Lessons</a><a href="resources.html">Resources</a><a href="profile.html">Profile</a>
</nav>
<main class="wrap">
<div class="card"><b>What are you teaching?</b><br><input id="topic" value="JSS2 Mathematics — Algebra" style="width:100%;min-height:48px;border:1px solid var(--line);border-radius:8px;padding:0 12px;margin-top:8px"></div>
<div class="card"><b>Start from</b><div class="chips"><span>Topic</span><span>Scheme</span><span>Textbook</span><span>Previous lesson</span><span>Blank</span></div></div>
<div class="card"><b>How much help?</b><div class="chips" id="modes"><span class="sel" data-m="quick">Quick Prep</span><span data-m="standard">Standard</span><span data-m="deep">Deep Prep</span></div><p class="hint">Sets the AI depth on the next screen (Stage 6). Manual writing always works.</p></div>
<div class="card"><b>Template</b><br><select id="tpl" style="width:100%;min-height:48px;border:1px solid var(--line);border-radius:8px;margin-top:8px"><option value="">Standard 18-section note (default)</option></select></div>
<p><button class="btn-p" id="draftBtn">Draft lesson →</button></p>
</main>
<script src="vendor/dexie.min.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
LP.ready().then(async function(){
  var sel = document.getElementById("tpl");
  (await LP.listTemplates()).forEach(function(t){
    var o = document.createElement("option"); o.value = t.tid; o.textContent = t.name + " (" + t.sections.length + ")";
    sel.appendChild(o);
  });
  document.getElementById("draftBtn").addEventListener("click", async function(){
    var t = document.getElementById("topic").value || "Untitled lesson";
    var l = await LP.newLesson(t, document.getElementById("tpl").value || null);
    var m = document.querySelector("#modes .sel");
    location.href = "lesson.html?id=" + l.id + (m ? "&mode=" + m.dataset.m : "");
  });
  document.getElementById("modes").addEventListener("click", function(e){
    if (e.target.tagName !== "SPAN") return;
    document.querySelectorAll("#modes span").forEach(function(x){ x.classList.remove("sel"); });
    e.target.classList.add("sel");
  });
});
</script>
</body>
</html>
